version: '3.7'

services:

  redpanda:
    image: docker.redpanda.com/redpandadata/console
    hostname: redpanda
    container_name: moodle-redpanda
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
      KAFKA_TLS_INSECURESKIPTLSVERIFY: true
      KAFKA_SCHEMAREGISTRY_ENABLED: true
      KAFKA_SCHEMAREGISTRY_URLS: http://schema-registry:8081
      KAFKA_SCHEMAREGISTRY_USERNAME: client
      KAFKA_SCHEMAREGISTRY_PASSWORD: client
      KAFKA_SCHEMAREGISTRY_TLS_ENABLED: false
      KAFKA_SCHEMAREGISTRY_TLS_INSECURESKIPTLSVERIFY: true
    depends_on:
      - kafka
      - schema-registry
      - zookeeper
    restart: always

  zookeeper:
    image: confluentinc/cp-zookeeper:6.1.1
    hostname: zookeeper
    container_name: moodle-zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    restart: always

  kafka:
    image: confluentinc/cp-enterprise-kafka:6.1.1
    hostname: kafka
    container_name: moodle-kafka
    tmpfs: /kafka/kafka-logs
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: -Xmx3G -Xms1G
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_DELETE_TOPIC_ENABLE: "true"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_MS: -1
      KAFKA_MESSAGE_MAX_BYTES: 10485880
      KAFKA_NUM_PARTITIONS: 1
      CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: kafka:9092
      CONFLUENT_METRICS_REPORTER_ZOOKEEPER_CONNECT: zookeeper:2181
      CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      CONFLUENT_METRICS_ENABLE: "true"
      CONFLUENT_SUPPORT_CUSTOMER_ID: 'anonymous'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

  schema-registry:
    image: confluentinc/cp-schema-registry:6.1.1
    container_name: moodle-schema-registry
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_CONNECTION_URL: zookeeper:2181
      SCHEMA_REGISTRY_LISTENERS: http://schema-registry:8081
      SCHEMA_REGISTRY_AVRO_COMPATIBILITY_LEVEL: 'forward_transitive'
    depends_on:
      - kafka
    restart: always

  prometheus:
    image: prom/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    restart: unless-stopped
    volumes:
      - ./prometheus:/etc/prometheus
      - prom_data:/prometheus

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana:/etc/grafana/provisioning/datasource.yml

  filebeat:
    image: elastic/filebeat:7.17.8
    user: root
    container_name: filebeat
    command:
      - "-e"
      - "--strict.perms=false"
    volumes:
      - ./config/beats/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./logs:/var/log/app_logs
    environment:
      LOGSTASH_HOST: logstash:5085
    depends_on:
      - logstash

  logstash:
    image: logstash:7.17.8
    container_name: logstash
    ports:
      - "9600:9600"
      - "5085:5085" # Puerto Beats
    environment:
      ELASTICSEARCH_HOST: elasticsearch:9200
    volumes:
      - ./config/logstash/app-logs.conf:/usr/share/logstash/pipeline/app-logs.conf:ro
      - ./config/logstash/templates:/usr/share/logstash/templates

  elasticsearch:
    image: elasticsearch:7.17.8
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"
    volumes:
      - elasticsearch:/usr/share/elasticsearch/data

  kibana:
    image: kibana:7.17.8
    container_name: kibana
    ports:
      - "5601:5601"

  yelteberus-db:
    image: postgres:14.1-alpine
    container_name: yelteberus-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin123
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  db:
  prom_data:
  elasticsearch:

networks:
  default:
    name: moodle