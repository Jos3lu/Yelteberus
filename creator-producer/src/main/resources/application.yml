server:
  port: 8082

spring:
  application:
    name: creator-producer
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        schema.registry.url: http://localhost:8081

management:
  endpoint:
    metrics:
      enabled: true
    prometheus:
      enabled: true
  endpoints:
    web:
      exposure:
        include: '*'
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  file:
    path: './logs/${spring.application.name}'
    name: ${logging.file.path}/my-app.log

environment.creator-topic: creators
environment.creator-topic-dlq: creators-dlq